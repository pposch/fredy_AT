name: Create and publish Docker image

on:
  push:
    branches:
      - 'master'
    # fredy-AT: only its own release tags (v*), not upstream's version tags that come along when
    # syncing the fork.
    tags:
      - 'v*'

jobs:
  docker:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      # fredy-AT publishes its own image instead of upstream's.
      image_name: pposch/fredy-at
      # master -> :latest + :<short sha>, release tag v1.2.3 -> :1.2.3 + :1.2
      tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=sha,prefix=,format=short
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
